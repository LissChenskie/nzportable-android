name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
      - run: sh tests/run_host_tests.sh
  apk:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare dependencies
        run: python3 scripts/bootstrap.py
      - name: Build optimized APK (import game ZIP on first launch)
        run: python3 scripts/build_apk.py --abi ${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: nzportable-android-${{ matrix.abi }}
          path: build/nzportable-android-${{ matrix.abi }}.apk
          if-no-files-found: error
