name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
      - run: sh tests/run_host_tests.sh
  vulkan-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools libgles2-mesa-dev xvfb
      - run: sh tests/run_vulkan_tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-test-evidence
          path: build/host-tests/
  apk:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare dependencies
        run: python3 scripts/bootstrap.py
      - name: Build optimized APK (import game ZIP on first launch)
        run: python3 scripts/build_apk.py --abi ${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: nzportable-android-${{ matrix.abi }}
          path: build/nzportable-android-${{ matrix.abi }}.apk
          if-no-files-found: error

  # Publish only when an explicitly marked release commit reaches main.
  # GitHub release assets come from the SAME tested workflow run.
  publish-android-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-apk]')
    needs: [host-tests, vulkan-tests, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: nzportable-android-arm64-v8a
          path: release
      - name: Download tested ARMv7 APK
        uses: actions/download-artifact@v4
        with:
          name: nzportable-android-armeabi-v7a
          path: release
      - name: Verify APK files
        run: |
          set -euo pipefail
          test -s release/nzportable-android-arm64-v8a.apk
          test -s release/nzportable-android-armeabi-v7a.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-android-20261029
          name: NZPortable Android - 2026-10-29 (experimental)
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Experimental Android port build for testing on Samsung Galaxy A51 and compatible phones.
            
            Includes Vulkan lightmapped BSP fog correction, LAN co-op player nickname,
            touch-friendly scrolling map selection, and CPU/RAM improvements.
            
            **ARM64 (arm64-v8a):** Recommended for Samsung Galaxy A51.
            **ARMv7 (armeabi-v7a):** For compatible 32-bit devices.
            
            Graphics API: GLES2 remains the Auto/default renderer because Vulkan
            performance and stability on Galaxy A51 still require physical testing.
            No automatic resolution or graphic quality reduction is introduced.
            
            APKs are signed with a DEVELOPMENT/TEST key and are NOT production releases.
            Game data are not embedded; import a compatible NZPortable game-data ZIP
            using the launcher when needed. 
            
            The build and host/Vulkan tests passed in the same CI run as this release.
            Real-device FPS, fog and LAN behavior still require validation.
          files: |
            release/nzportable-android-arm64-v8a.apk
            release/nzportable-android-armeabi-v7a.apk
            release/SHA256SUMS.txt
